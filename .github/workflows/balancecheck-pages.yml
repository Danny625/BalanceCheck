name: Publish BalanceCheck dashboard

on:
  push:
    branches: [main]
    paths:
      - sites/balancecheck/dist/**
      - .github/workflows/balancecheck-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: balancecheck-pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/balancecheck/dist

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
